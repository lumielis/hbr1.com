var locTime = new Date();
var servTime = 1034982528 * 1000;
var diffTime = locTime.getTime() - servTime;

function initPage() {
  var urls = new Array();
  var tmp = '0123456789apm:';
  var i;
  for( i = 0; i < tmp.length; i ++ ) {
    urls[urls.length] = 'images/courier11/_c' + tmp.charCodeAt( i ) + '.gif';
  }
  urls[urls.length] = 'images/courier11/spacer.gif';
  preloadImages( urls );
}

function startProgram() {
  var now = new Date();
  timerCounter = 0;
  timerThread = setInterval( "displayTimes()", "1000" );
}

function preloadImages( urls ) {
  if( ! document.imageBuffer )
    document.imageBuffer = new Array();
  var i, j;
  for( i = 0; i < urls.length; i ++ ) {
    j = document.imageBuffer.length;
    document.imageBuffer[j] = new Image();
    document.imageBuffer[j].onerror = onImageError;
    document.imageBuffer[j].onload = onImageComplete;
  }
  for( i = 1; i <= urls.length; i ++ ) {
    j = document.imageBuffer.length - i;
    document.imageBuffer[j].src = urls[i-1];
  }
  if( navigator.userAgent.match( /Opera/ ) ) {
    startProgram();
  }
}

function onImageComplete() {
  this.status = 1;
  var i, i_ok = 0, i_fail = 0;
  for( i = 0; i < document.imageBuffer.length; i ++ ) {
    if( document.imageBuffer[i].status == 1 )
      i_ok ++;
    else if( document.imageBuffer[i].status == -1 )
      i_fail ++;
  }
  if( document.imageBuffer.length == i_ok + i_fail ) {
    if( i_fail > 0 )
      alert( 'image caching process completed\n' + i_fail + ' of ' + document.imageBuffer.length + ' images could not be loaded!' );
    startProgram();
  }
}

function onImageError() {
  this.status = -1;
  var i, i_ok = 0, i_fail = 0;
  for( i = 0; i < document.imageBuffer.length; i ++ ) {
    if( document.imageBuffer[i].status == 1 )
      i_ok ++;
    else if( document.imageBuffer[i].status == -1 )
      i_fail ++;
  }
  if( document.imageBuffer.length == i_ok + i_fail ) {
    if( i_fail > 0 )
      alert( 'image caching process completed\n' + i_fail + ' of ' + document.imageBuffer.length + ' images could not be loaded!' );
    startProgram();
  }
}

function findImage( url ) {
  var i;
  for( i = 0; i < document.imageBuffer.length; i ++ ) {
    if( document.imageBuffer[i].src.match( url ) )
      return document.imageBuffer[i];
  }
  return null;
}

function displayTimes() {
  var now = new Date();
  var utc = now.getTimezoneOffset();
  displayTime( 'images/courier11/', 'newyork', utc - 300, timerCounter );
  displayTime( 'images/courier11/', 'local', utc + 60, timerCounter );
  displayTime( 'images/courier11/', 'gmt', utc, timerCounter );
  displayTime( 'images/courier11/', 'tokyo', utc + 480, timerCounter );
  displayTime( 'images/courier11/', 'melbourne', utc + 540, timerCounter );
  timerCounter = ( timerCounter ? 0 : 1 );
}

function displayTime( imagePath, name, timezoneOffset, timerCounter ) {
  if( ! document['timeBuffer_'+name] ) {
    document['timeBuffer_'+name] = new Date();
    document['timeBuffer_'+name].setTime( 0 );
  }
  var now = new Date();
  now.setTime( now.getTime() + timezoneOffset * 60000 );
  var tmp = now.getHours();
  if( tmp != document['timeBuffer_'+name].getHours() ) {
    if( tmp == 0 ) tmp = 24;
    if( tmp > 12 ) {
      tmp -= 12;
      document.images[name+'_dt_1'].src = findImage( imagePath + ( tmp == 12 ? '_c97.gif' :  '_c112.gif' ) ).src;
    }
    else {
      document.images[name+'_dt_1'].src = findImage( imagePath + ( tmp == 0 ? '_c112.gif' :  '_c97.gif' ) ).src;
    }
    tmp = tmp < 10 ? '0' + tmp : '' + tmp;
    document.images[name+'_hour_1'].src = findImage( imagePath + '_c' + tmp.charCodeAt( 0 ) + '.gif' ).src;
    document.images[name+'_hour_2'].src = findImage( imagePath + '_c' + tmp.charCodeAt( 1 ) + '.gif' ).src;
    
  }
  tmp = now.getMinutes();
  if( tmp != document['timeBuffer_'+name].getMinutes() ) {
    tmp = tmp < 10 ? '0' + tmp : '' + tmp;
    document.images[name+'_minute_1'].src = findImage( imagePath + '_c' + tmp.charCodeAt( 0 ) + '.gif' ).src;
    document.images[name+'_minute_2'].src = findImage( imagePath + '_c' + tmp.charCodeAt( 1 ) + '.gif' ).src;
  }
  tmp = now.getSeconds();
  if( tmp != document['timeBuffer_'+name].getSeconds() ) {
    tmp = tmp < 10 ? '0' + tmp : '' + tmp;
    document.images[name+'_second_1'].src = findImage( imagePath + '_c' + tmp.charCodeAt( 0 ) + '.gif' ).src;
    document.images[name+'_second_2'].src = findImage( imagePath + '_c' + tmp.charCodeAt( 1 ) + '.gif' ).src;
  }
  document['timeBuffer_'+name].setTime( now.getTime() );
}
