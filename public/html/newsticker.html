var warte;

	window.status=text;
	warte=40;
	setTimeout("zuruecksetzen()",30);
	}
function zuruecksetzen(){
	warte--;
	if (warte>1)
	setTimeout("zuruecksetzen()",30);

var speed = 100
var pause = 3500
var timerID = null
var NewsRunning = false
var MessageArray = new Array()
MessageArray['0']="Einen erfolgreichen Tag wünscht Ihnen Ihr pferdewetten.de Team...";
MessageArray['0'] = "Ticker Nachricht 1";
MessageArray['1'] = "Catterick: Recke-Schützling Beanney (M. Fitzgerald) gewinnt zum Totokurs von 100:10 ein Novices´ Hurdle über 3200 Meter...der von Mario Hofer trainierte Montecorvino (O. Nelmes) belegt in einem ´Bumper´ den Ehrenplatz...Lomicelli unplatziert... ";
var currentMessage = 0
var offset = 0

function stopNews() {
	if (NewsRunning)
	clearTimeout(timerID)
 	NewsRunning = false
}

function startNews() {
	stopNews()
	showNews()
}
function showNews() {
        var text = MessageArray[currentMessage]
        if (offset < text.length) {
                if (text.charAt(offset) == " ")
                        offset++
                var partialMessage = text.substring(0, offset + 1)
                document.NewsForm.NewsField.value = partialMessage
                offset++
                timerID = setTimeout("showNews()", speed)
		NewsRunning = true
        } else {
                offset = 0
                currentMessage++
                if (currentMessage == MessageArray.length)
                        currentMessage = 0
                timerID = setTimeout("showNews()", pause)
		NewsRunning = true
        }
}
