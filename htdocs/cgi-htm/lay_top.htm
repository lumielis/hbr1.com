var locTime = new Date();

var diffTime = locTime.getTime() - servTime.getTime();

function initPage() {
  var urls = new Array();
  var tmp = '0123456789apm:';
  var i;
  for( i = 0; i < tmp.length; i ++ ) {
    urls[urls.length] = '<URL_IMAGES>/courier11/_c' + tmp.charCodeAt( i ) + '.gif';
  }
  urls[urls.length] = '<URL_IMAGES>/courier11/spacer.gif';
  preloadImages( urls );
}

function startProgram() {
  timerCounter = 0;
  timerThread = setInterval( "displayTimes()", "1000" );
}

function preloadImages( urls ) {
  if( ! document.imageBuffer )
    document.imageBuffer = new Array();
  var i, j;
  for( i = 0; i < urls.length; i ++ ) {
    j = document.imageBuffer.length;
    document.imageBuffer[j] = new Image();
    document.imageBuffer[j].onerror = onImageError;
    document.imageBuffer[j].onload = onImageComplete;
  }
  for( i = 1; i <= urls.length; i ++ ) {
    j = document.imageBuffer.length - i;
    document.imageBuffer[j].src = urls[i-1];
  }
  if( navigator.userAgent.match( /Opera/ ) || navigator.userAgent.match( /Konqueror/ ) ) {
    startProgram();
  }
}

function onImageComplete() {
  this.status = 1;
  var i, i_ok = 0, i_fail = 0;
  for( i = 0; i < document.imageBuffer.length; i ++ ) {
    if( document.imageBuffer[i].status == 1 )
      i_ok ++;
    else if( document.imageBuffer[i].status == -1 )
      i_fail ++;
  }
  if( document.imageBuffer.length == i_ok + i_fail ) {
    if( i_fail > 0 )
      alert( 'image caching process completed\n' + i_fail + ' of ' + document.imageBuffer.length + ' images could not be loaded!' );
    startProgram();
  }
}

function onImageError() {
  this.status = -1;
  var i, i_ok = 0, i_fail = 0;
  for( i = 0; i < document.imageBuffer.length; i ++ ) {
    if( document.imageBuffer[i].status == 1 )
      i_ok ++;
    else if( document.imageBuffer[i].status == -1 )
      i_fail ++;
  }
  if( document.imageBuffer.length == i_ok + i_fail ) {
    if( i_fail > 0 )
      alert( 'image caching process completed\n' + i_fail + ' of ' + document.imageBuffer.length + ' images could not be loaded!' );
    startProgram();
  }
}

function displayTimes() {
  var now = new Date();
  var utc = now.getTimezoneOffset();
  displayTime( '<URL_IMAGES>/courier11/', 'newyork', utc - 300, timerCounter );
  displayTime( '<URL_IMAGES>/courier11/', 'berlin', utc + 60, timerCounter );
  displayTime( '<URL_IMAGES>/courier11/', 'gmt', utc, timerCounter );
  displayTime( '<URL_IMAGES>/courier11/', 'tokyo', utc + 600, timerCounter );
  displayTime( '<URL_IMAGES>/courier11/', 'melbourne', utc + 480, timerCounter );
  timerCounter = ( timerCounter ? 0 : 1 );
}

function displayTime( imagePath, name, timezoneOffset, timerCounter ) {
  var draw_all = false;
  if( ! document['timeBuffer_'+name] ) {
    document['timeBuffer_'+name] = new Date();
    draw_all = true;
  }
  var now = new Date();
  now.setTime( now.getTime() + timezoneOffset * 60000 - diffTime );
  var tmp = now.getHours();
  if( draw_all || tmp != document['timeBuffer_'+name].getHours() ) {
    if( tmp == 0 ) tmp = 24;
    if( tmp > 12 ) {
      tmp -= 12;
      document.images[name+'_dt_1'].src = imagePath + ( tmp == 12 ? '_c97.gif' :  '_c112.gif' );
    }
    else {
      document.images[name+'_dt_1'].src = imagePath + ( tmp == 0 ? '_c112.gif' :  '_c97.gif' );
    }
    tmp = tmp < 10 ? '0' + tmp : '' + tmp;
    document.images[name+'_hour_1'].src = imagePath + '_c' + tmp.charCodeAt( 0 ) + '.gif';
    document.images[name+'_hour_2'].src = imagePath + '_c' + tmp.charCodeAt( 1 ) + '.gif';
    
  }
  tmp = now.getMinutes();
  if( draw_all ||tmp != document['timeBuffer_'+name].getMinutes() ) {
    tmp = tmp < 10 ? '0' + tmp : '' + tmp;
    document.images[name+'_minute_1'].src = imagePath + '_c' + tmp.charCodeAt( 0 ) + '.gif';
    document.images[name+'_minute_2'].src = imagePath + '_c' + tmp.charCodeAt( 1 ) + '.gif';
  }
  tmp = now.getSeconds();
  if( draw_all || tmp != document['timeBuffer_'+name].getSeconds() ) {
    tmp = tmp < 10 ? '0' + tmp : '' + tmp;
    document.images[name+'_second_1'].src = imagePath + '_c' + tmp.charCodeAt( 0 ) + '.gif';
    document.images[name+'_second_2'].src = imagePath + '_c' + tmp.charCodeAt( 1 ) + '.gif';
  }
  document['timeBuffer_'+name].setTime( now.getTime() );
}
