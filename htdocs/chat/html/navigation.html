<script language="JavaScript"> 
<!--

      out += '<td bgcolor="#' + cmc[i] + '" class="color_cell" width="7" height="4"><a href="javascript:SetColor( &quot;' + cmc[i] + '&quot; );"><font color="#' + cmc[i] + '">OO</font></a></td>\n';
    }
    cmc = SmoothColor( col, clw, color_cols );
    for( i = 1; i < color_cols; i ++ ) {
      out += '<td bgcolor="#' + cmc[i] + '" class="color_cell" width="7" height="4"><a href="javascript:SetColor( &quot;' + cmc[i] + '&quot; );"><font color="#' + cmc[i] + '">OO</font></a></td>\n';
    }
    out += '</tr>';
  }
  
  out += '</table>';

  if( parent && parent.Resized ) {
    UpdateClients( parent.UserList );

  }
  
  ArrangeLayers();
  
}

function SetColor( color ) {
  if( ! parent || ! parent.SetColor ) return;
  parent.SetColor( color );
  if( parent.FocusInput ) parent.FocusInput();
}

function PreviewColor( color ) {
  var out = '<table width="128" height="10"><tr><td class="color_cell" bgcolor="#' + color + '">&nbsp;</td></tr></table>';
  ColorReview.setContent( SetTableContent( 'preview', out ) );
}

function SelectUser( id ) {
  if( parent && parent.PrivateMessage ) {
    parent.PrivateMessage( id, 0 );
  }
}

function UpdateClients( list ) {
  var i, elm, opt;
  if( ! list.length ) return LoginForm();
  var out = '<table border="0" cellspacing="3" cellpadding="0">';
  out += '<tr><td class="ns">';
  out += '<select name="Client" class="nl" id="selectFixed" size="5" ondblclick="ClientAction(1); ClientForm(this.form);">';
  for( i = 0; i < list.length; i += 3 ) out += '<option>' + list[i+1] + '</option>';
  out += '</select></td></tr>';
  out += '<tr><td><input type="submit" value="Write Something" onclick="ClientAction(1);"></td></tr>';
  out += '<tr><td><a href="javascript:Logout();"><b>paranoia!!!</b></a></td></tr>';
  out += '</table>';
  UserList.setContent( SetTableContent( 'fraggles in room', out, '<form name="formClients" onSubmit="return ClientForm(this);">', '</form>' ) );
}

function UpdateRooms( list, room ) {
  var out = '<table border="0" cellspacing="3" cellpadding="0"><tr><td>';
  out += '<select name="Room" id="selectFixed" OnClick="ChangeRoom( this );">';
  for( var i = 0; i < list.length; i += 2 ) out += '<option>' + list[i+1] + '</option>';
  out += '</select></td></tr></table>';
  RoomList.setContent( SetTableContent( 'hbr1&nbsp;rooms', out, '<form name="formRooms" onSubmit="return false;">', '</form>' ) );
  SelectRoom( room );
}

function LoginForm() {
  var size = document.all ? 15 : 10;
  var nick = parent.JSM_Client ? parent.JSM_Client : 'Nickname';
  var pass = parent.JSM_Pass ? parent.JSM_Pass : 'Passwort';
  var out = '<table border="0" cellspacing="3" cellpadding="0">';
  out += '<tr><td class="ns">';
  out += '<input type="text" name="Nick" size="' + size + '" value="' + nick + '" id="nl"></td></tr>';
  out += '<tr><td><input type="password" name="Pass" size="' + size + '" value="' + pass + '" id="nl"></td></tr>';
  out += '<tr><td><input type="submit" value="Login"></td></tr>';
  out += '</table>';
  UserList.setContent( SetTableContent( 'come in', out, '<form name="formLogin" onSubmit="return Login( this );">', '</form>' ) );
}

function Login( Sender ) {
  if( ! Sender || ! parent.document ) return false;
  parent.JSM_Client = Sender.Nick.value;
  parent.JSM_Pass = Sender.Pass.value;
  if( document.curRoom ) parent.JSM_Room = document.curRoom;
  if( parent.Login ) parent.Login();
  return false;
}

function Logout() {
  if( parent.Logout ) parent.Logout();
}

function ChangeRoom( Sender ) {
  if( ! Sender || ! parent.document ) return false;
  if( ! parent.ChangeRoom || Sender.selectedIndex < 0 ) return false;
  if( document.curRoom == Sender.options[Sender.selectedIndex].text ) return true;
  document.curRoom = Sender.options[Sender.selectedIndex].text;
  parent.ChangeRoom( Sender.options[Sender.selectedIndex].text );
  return true;
}

function SelectRoom( room ) {
  if( ! room ) return false;
  document.curRoom = room;
  var obj = findNodeByName( RoomList.layer, 'SELECT', 'Room' );
  if( ! obj && document.layers )
    obj = RoomList.layer.document.forms['formRooms'].elements['Room'];
  if( ! obj || ! obj.options ) return false;
  for( var i = 0; i < obj.options.length; i ++ ) {
    obj.options[i].selected = obj.options[i].text == room;
  }
  return true;
}

function updateSessionTime( from, to ) {
  var now = new Date();
  var dt = new Date();
  RoomImageEnabled = false;
  if( now.getTime() > from && now.getTime() < to ) {
    ImageRun = true;
  }
  else {
    if( RoomImageObject ) RoomImageObject.stop();
    var out = '<table border=0 cellspacing=1 cellpadding=0>';
    dt.setTime( from );
    out += '<tr><td colspan=6><u>next live chat</u></td></tr>';
    out += '<tr><td>begin:&nbsp;</td>';
    out += '<td align=right class="blue">' + ( dt.getDate() < 10 ? '0' : '' ) + dt.getDate() + '.</td>';
    out += '<td align=right class="blue">' + ( dt.getMonth() < 9 ? '0' : '' ) + ( dt.getMonth() + 1 ) + '.</td>';
    out += '<td align=right class="blue">' + ( dt.getYear() < 100 ? '19' : '' ) + dt.getYear() + '&nbsp;&nbsp;</td>';
    out += '<td align=right class="blue">' + ( dt.getHours() < 10 ? '0' : '' ) + dt.getHours() + ':</td>';
    out += '<td align=right class="blue">' + ( dt.getMinutes() < 10 ? '0' : '' ) + dt.getMinutes() + '</td></tr>';
    dt.setTime( to );
    out += '<tr><td>end:&nbsp;</td>';
    out += '<td align=right class="blue">' + ( dt.getDate() < 10 ? '0' : '' ) + dt.getDate() + '.</td>';
    out += '<td align=right class="blue">' + ( dt.getMonth() < 9 ? '0' : '' ) + ( dt.getMonth() + 1 ) + '.</td>';
    out += '<td align=right class="blue">' + ( dt.getYear() < 100 ? '19' : '' ) + dt.getYear() + '&nbsp;&nbsp;</td>';
    out += '<td align=right class="blue">' + ( dt.getHours() < 10 ? '0' : '' ) + dt.getHours() + ':</td>';
    out += '<td align=right class="blue">' + ( dt.getMinutes() < 10 ? '0' : '' ) + dt.getMinutes() + '</td></tr>';
    out += '</table>';
    SessionTime.setContent( SetTableContent( 'interview', out ) );
    ImageRun = false;
    ArrangeLayers();
  }
}

function SetTableContent( title, content, before, after ) {
  if( ! before ) before = '';
  if( ! after ) after = '';
  var out = before
  + '<table border=0 cellspacing=0 cellpadding=0 width=184>'
  + '<tr><td>'
  + '<table border=0 cellspacing=0 cellpadding=0 width=100%>'
  + '<tr><td background="../images/nav_header.gif" height=17><font color=#CCCCFF><b>&nbsp;&nbsp;' + title + '</b></font></td></tr>'
  + '</table></td></tr><tr><td>'
  + '<table border=0 cellspacing=1 cellpadding=2 bgcolor=#0F006F width=100%>'
  + '<tr><td align=center>' + content + '</td></tr></table>'
  + '</td></tr></table>' + after;
  //alert( out );
  return out;
}

function ClientAction( Sender ) {
  document.Action = parseInt( Sender );
  return false;
}

function ClientForm( Sender ) {
  if( ! Sender ) return false;
  var id, obj = Sender.elements['Client'];
  if( obj.selectedIndex < 0 ) return false;
  switch( document.Action ) {
    case 1: // private message
      id = parent.GetClientId( obj.options[obj.selectedIndex].text );
      if( id ) parent.PrivateMessage( id );
      break;
  }
  return false;
}

function SetRoomImage( url, title ) {
  if( ! ImageRun ) return false;
  if( ! RoomImageObject ) {
    RoomImageObject = findNodeByName( RoomImage.layer, 'APPLET' );
    if( ! RoomImageObject ) {
      if( ! document.applets ) return false;
      if( ! document.applets.length ) return false;
      RoomImageObject = document.applets[0]
    }
  }
  if( title ) RoomImageObject.setTitle( title );
  RoomImageObject.setUrl( url );
  RoomImageObject.start();
  RoomImageEnabled = true;
  ArrangeLayers();
}

function setProtocol( proto, host, port ) {
  if( ! RoomImageObject ) {
    RoomImageObject = findNodeByName( RoomImage.layer, 'APPLET' );
    if( ! RoomImageObject ) {
      if( ! document.applets ) return false;
      if( ! document.applets.length ) return false;
      RoomImageObject = document.applets[0]
    }
  }
  RoomImageObject.setProtocol( proto, host, port );
  parent.OnInitServer = null;
}

function setRefresh( refresh ) {
  if( ! RoomImageObject ) {
    RoomImageObject = findNodeByName( RoomImage.layer, 'APPLET' );
    if( ! RoomImageObject ) {
      if( ! document.applets ) return false;
      if( ! document.applets.length ) return false;
      RoomImageObject = document.applets[0]
    }
  }
  RoomImageObject.setRefresh( refresh );
}

function OnLogin() {
  return;
  if( ! RoomImageEnabled && RoomImageObject ) {
    RoomImageObject.start();
    RoomImageEnabled = true;
    ArrangeLayers();
  }
}

function OnLogout() {
  RoomImageEnabled = false;
  if( RoomImageObject ) RoomImageObject.stop();
  //ArrangeLayers();
}

function ArrangeLayers() {
  var Top = 5;
  RoomImage.hide();
  ColorReview.hide();
  ColorTable.hide();
  UserList.hide();
  RoomList.hide();
  SessionTime.hide();
  if( ! ImageRun ) {
    SessionTime.setPosition( 5, Top );
    SessionTime.show();
    Top += 71;
  }
  else if( RoomImageEnabled ) {
    RoomImage.setPosition( 5, Top );
    RoomImage.show();
    Top += 175;
  }
  ColorTable.setPosition( 5, Top );
  ColorTable.show();
  Top += 88;
  RoomList.setPosition( 5, Top );
  RoomList.show();
  Top += 52;
  UserList.setPosition( 5, Top );
  UserList.show();
}

// initialization

var ColorTable = new Layer( 'ColorTable' );
var ColorReview = new Layer( 'ColorReview' );
var UserList = new Layer( 'UserList' );
var RoomList = new Layer( 'RoomList' );
var RoomImage = new Layer( 'RoomImage' );
var SessionTime = new Layer( 'SessionTime' );
var RoomImageEnabled = false;
var RoomImageObject = null;
var ImageRun = true;
var RoomImageTimer = null;

if( parent ) {
  parent.OnSetColor = PreviewColor;
  parent.OnUserList = UpdateClients;
  parent.OnRoomList = UpdateRooms;
  parent.OnRoomImage = SetRoomImage;
  parent.OnLogin = OnLogin;
  parent.OnLogout = OnLogout;
  parent.OnSessionTime = updateSessionTime;
  parent.OnInitServer = setProtocol;
  parent.OnSetRefresh = setRefresh;
  if( parent.AddReloadFrame ) parent.AddReloadFrame( this );
}

//-->
</script>
