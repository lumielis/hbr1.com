<VirtualHost *:80>
    ServerName www.hbr1.com
    ServerAlias hbr1.com
    Redirect permanent / https://www.hbr1.com/
</VirtualHost>

<VirtualHost *:443>
    ServerAdmin admin@hbr1.com
    ServerName www.hbr1.com
    ServerAlias hbr1.com

    DocumentRoot /var/projects/www.hbr1.com/htdocs

    ErrorLog /var/projects/www.hbr1.com/log/error.log
    CustomLog "/var/projects/www.hbr1.com/log/access.log" "combined"

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/hbr1.com/cert.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/hbr1.com/privkey.pem
    SSLCertificateChainFile /etc/letsencrypt/live/hbr1.com/fullchain.pem
    # SSLCertificateFile /etc/letsencrypt/live/hbr1.com/fullchain.pem
    # SSLCertificateKeyFile /etc/letsencrypt/live/hbr1.com/privkey.pem

    HostnameLookups Off
    UseCanonicalName Off
    ServerSignature On

    AddType application/x-opera-widgets .wgt

    <Directory "/var/projects/www.hbr1.com/htdocs/">
        Options Indexes FollowSymLinks ExecCGI
        AllowOverride All
        Require all granted
    </Directory>

    ScriptAlias /cgi-bin/ "/var/projects/www.hbr1.com/cgi-bin/"
    ScriptAlias /run/ "/var/projects/www.hbr1.com/cgi-bin/"

    <Directory "/var/projects/www.hbr1.com/cgi-bin/">
        AllowOverride None
        Options +ExecCGI -Includes
        Require all granted
    </Directory>

	<IfModule mod_perl.c>

		ScriptAlias /perl/ "/var/projects/www.hbr1.com/cgi-bin/"
		<Location /perl/>
			# mod_perl mode
			SetHandler perl-script
			PerlResponseHandler ModPerl::Registry
			PerlOptions +ParseHeaders
			Options +ExecCGI
		</Location>

		ScriptAlias /cgi-perl/ "/var/projects/www.hbr1.com/cgi-bin/"
		<Location /cgi-perl>
			# perl cgi mode
			SetHandler  perl-script
			PerlResponseHandler ModPerl::PerlRun
			PerlOptions +ParseHeaders
			Options +ExecCGI
		</Location>

		PerlModule PAB3::ModPerl::Registry
		Alias /cgi-pab/ "/var/projects/www.hbr1.com/cgi-bin/"
		<Location /cgi-pab>
			SetHandler perl-script
			PerlResponseHandler PAB3::ModPerl::Registry
			PerlOptions -ParseHeaders +GlobalRequest +SetupEnv
			PerlSetVar Package HBR1v3
			Options +ExecCGI
		</Location>
	</IfModule>

</VirtualHost>
