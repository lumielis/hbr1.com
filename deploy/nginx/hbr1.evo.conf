# HBR1 development vhost (nginx + php-fpm, WSL)
#
# The dev box is an approximation of production (Apache + mod_fcgid). Keep the
# two config files in sync; production truth lives in deploy/apache/.
server {
    listen       80;
    server_name  hbr1.evo;

    root   "/host/Projekte/Privat/hbr1.com/public";
    index  index.php;

    charset utf-8;
    client_max_body_size 20M;

    # Never list directories, never serve dotfiles.
    autoindex off;
    location ~ /\. { deny all; }

    location ~ \.php$ {
        fastcgi_pass    php8_3-handler;
        fastcgi_index   index.php;
        include         fastcgi.conf;
        fastcgi_read_timeout 300;
        fastcgi_param   SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Every static asset the site uses is inside `public/`, so the web server
    # serves it directly and this is the only rule needed for everything else.
    #
    # The former per-directory aliases (`/images/`, `/style/`, `/gp/`,
    # `/playlist/`, `/chat/`, `/webtv/`, …) are gone. They had to exist because
    # the assets lived outside the document root, and they were actively harmful:
    # a prefix location wins over `location /` even for a file that is not there,
    # so `/playlist/{station}` and `/webtv/ticker/content.htm` 404'd unless each
    # prefix got its own `try_files … @app` escape hatch.
    #
    # `$uri/` is deliberately NOT in the list. It matches a *directory*, and with
    # `autoindex off` that is a 403 - it never reaches PHP. Two URLs are
    # directories that must be routes: `/webtv/ticker/` (the front page's `lcam`
    # frame) and `/chat/`. Letting a directory fall through to the front
    # controller is what makes the file and the route agree instead of racing.
    location / {
        try_files $uri /index.php?$query_string;
    }

    # Legacy entry points are translated by the application
    # (App\Http\LegacyUrlMapper), so they must reach the front controller -
    # never be blanket-redirected, or every legacy URL loses its canonical
    # target and lands on "/". Routing them to PHP is also what guarantees the
    # web server never executes anything (there is nothing left to execute:
    # production has no Perl, so cgi-bin/ now lives in legacy/archive/).
    location ^~ /cgi-bin/ { try_files /dev/null /index.php?$query_string; }
    location ^~ /run/     { try_files /dev/null /index.php?$query_string; }
    location ^~ /perl/    { try_files /dev/null /index.php?$query_string; }

    # Block anything that must not be public even on the dev box.
    location ~ ^/(config|app|views|db|deploy|tools|tests|legacy|var|data)/ {
        deny all;
    }
}