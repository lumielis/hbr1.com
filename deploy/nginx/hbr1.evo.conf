# HBR1 development vhost (nginx + php-fpm, WSL)
#
# The dev box is an approximation of production (Apache + mod_fcgid). Keep the
# two config files in sync; production truth lives in deploy/apache/.

server {
    listen       80;
    server_name  hbr1.evo;

    root   "/host/Projekte/Privat/hbr1.com/public";
    index  index.php;

    charset utf-8;
    client_max_body_size 20M;

    # Never list directories, never serve dotfiles.
    autoindex off;
    location ~ /\. { deny all; }

    location ~ \.php$ {
        fastcgi_pass    php8_3-handler;
        fastcgi_index   index.php;
        include         fastcgi.conf;
        fastcgi_read_timeout 300;
        fastcgi_param   SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Single entry point.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Static assets remain in the legacy tree, outside public/.
    location /images/  { alias /host/Projekte/Privat/hbr1.com/htdocs/images/; }
    location /style/   { alias /host/Projekte/Privat/hbr1.com/htdocs/style/; }
    location /jscript/ { alias /host/Projekte/Privat/hbr1.com/htdocs/jscript/; }
    location /webtv/   { alias /host/Projekte/Privat/hbr1.com/htdocs/webtv/; }
    location /playlist/ { alias /host/Projekte/Privat/hbr1.com/htdocs/playlist/; }
    location /chat/    { alias /host/Projekte/Privat/hbr1.com/htdocs/chat/; }

    # Legacy entry points are matched by the application, but keep the web
    # server from ever executing anything under cgi-bin.
    location ^~ /cgi-bin/ { return 301 /; }
    location ^~ /run/     { return 301 /; }
    location ^~ /perl/    { return 301 /; }

    # Block anything that must not be public even on the dev box.
    location ~ ^/(config|app|views|db|deploy|tools|tests|legacy|var|cgi-bin|data)/ {
        deny all;
    }
}
