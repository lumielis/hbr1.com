# HBR1 development vhost (nginx + php-fpm, WSL)
#
# The dev box is an approximation of production (Apache + mod_fcgid). Keep the
# two config files in sync; production truth lives in deploy/apache/.

server {
    listen       80;
    server_name  hbr1.evo;

    root   "/host/Projekte/Privat/hbr1.com/public";
    index  index.php;

    charset utf-8;
    client_max_body_size 20M;

    # Never list directories, never serve dotfiles.
    autoindex off;
    location ~ /\. { deny all; }

    location ~ \.php$ {
        fastcgi_pass    php8_3-handler;
        fastcgi_index   index.php;
        include         fastcgi.conf;
        fastcgi_read_timeout 300;
        fastcgi_param   SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Single entry point.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Static assets still live in the legacy tree, outside public/.
    #
    # These used to be plain `alias` blocks, which shadowed the application:
    # /playlist/ swallowed /playlist/{station}, because a prefix location wins
    # over `location /` even when the file does not exist. Apache does the
    # right thing here (Alias + FallbackResource only serves an existing file),
    # so mirror that: serve the file if it is there, otherwise hand the request
    # to the front controller.
    location ^~ /images/   { root /host/Projekte/Privat/hbr1.com/htdocs; try_files $uri @app; }
    location ^~ /style/    { root /host/Projekte/Privat/hbr1.com/htdocs; try_files $uri @app; }
    location ^~ /jscript/  { root /host/Projekte/Privat/hbr1.com/htdocs; try_files $uri @app; }
    location ^~ /webtv/    { root /host/Projekte/Privat/hbr1.com/htdocs; try_files $uri @app; }
    location ^~ /playlist/ { root /host/Projekte/Privat/hbr1.com/htdocs; try_files $uri @app; }
    location ^~ /chat/     { root /host/Projekte/Privat/hbr1.com/htdocs; try_files $uri @app; }

    # A legacy static file was not found - let the application route the path.
    location @app {
        fastcgi_pass    php8_3-handler;
        fastcgi_index   index.php;
        include         fastcgi.conf;
        fastcgi_read_timeout 300;
        fastcgi_param   SCRIPT_FILENAME /host/Projekte/Privat/hbr1.com/public/index.php;
    }

    # Legacy entry points are translated by the application
    # (App\Http\LegacyUrlMapper), so they must reach the front controller -
    # never be blanket-redirected, or every legacy URL loses its canonical
    # target and lands on "/". Routing them through PHP also guarantees the
    # web server never executes anything under cgi-bin.
    location ^~ /cgi-bin/ { try_files /dev/null @app; }
    location ^~ /run/     { try_files /dev/null @app; }
    location ^~ /perl/    { try_files /dev/null @app; }

    # Block anything that must not be public even on the dev box.
    location ~ ^/(config|app|views|db|deploy|tools|tests|legacy|var|data)/ {
        deny all;
    }
}
