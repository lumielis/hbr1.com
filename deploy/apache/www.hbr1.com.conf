# HBR1 production vhost (Apache 2.4, Ubuntu 24.04)
#
# This file mirrors what actually runs today, with the two Phase-0 exposure
# fixes applied and a documented cutover target. It is NOT loaded automatically
# - it is the reviewed source of truth for /etc/apache2/sites-enabled/.
#
# Current state (documented in plan.md §2):
#   - /cgi-bin/, /run/       -> mod_cgi, shebang driven
#   - /perl/, /cgi-perl/, /cgi-pab/ -> mod_perl (ModPerl::Registry, PAB3)
#   - .php                   -> mod_fcgid via /usr/bin/php-cgi
#   - SuexecUserGroup christian www
#
# Cutover target: DocumentRoot -> public/, legacy aliases -> RedirectMatch.

ServerName www.hbr1.com
ServerAlias hbr1.com

<VirtualHost *:80>
    ServerName www.hbr1.com
    ServerAlias hbr1.com
    Redirect permanent / https://www.hbr1.com/
</VirtualHost>

<VirtualHost *:443>
    ServerAdmin admin@hbr1.com
    ServerName www.hbr1.com
    ServerAlias hbr1.com

    # --- CUTOVER: change this one line ---
    # DocumentRoot /home/christian/WWWRoot/www.hbr1.com/htdocs
    DocumentRoot /home/christian/WWWRoot/www.hbr1.com/public

    ErrorLog  /home/christian/WWWRoot/www.hbr1.com/var/log/error.log
    CustomLog /home/christian/WWWRoot/www.hbr1.com/var/log/access.log combined

    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/hbr1.com/cert.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/hbr1.com/privkey.pem
    SSLCertificateChainFile /etc/letsencrypt/live/hbr1.com/fullchain.pem

    HostnameLookups Off
    UseCanonicalName Off
    ServerSignature On

    AddType application/x-opera-widgets .wgt

    # ---------------------------------------------------------------------
    # Application root
    # ---------------------------------------------------------------------
    <Directory "/home/christian/WWWRoot/www.hbr1.com/public">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # ---------------------------------------------------------------------
    # Phase 0: things that must never be reachable over HTTP.
    # Without these, config.pab.pl (DB credentials) and settings.inc were
    # served as plain text and /cgi-bin/include/ could be listed.
    # ---------------------------------------------------------------------
    <DirectoryMatch "^/home/christian/WWWRoot/www\.hbr1\.com/(cgi-bin/(include|lib|module)|config|app|views|db|deploy|tools|tests|legacy|var)">
        Require all denied
    </DirectoryMatch>

    # Dotfiles (including the .htpasswd) and editor/backup droppings.
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
    <FilesMatch "(\.(bak|old|orig|swp|save|inc|pl|pm|pab|cgi|xp|tt)$)$">
        Require all denied
    </FilesMatch>

    # ---------------------------------------------------------------------
    # PHP via mod_fcgid (unchanged from the current server)
    # ---------------------------------------------------------------------
    <IfModule mod_fcgid.c>
        AddHandler fcgid-script .php
        FcgidWrapper "/usr/bin/php-cgi -c /etc/" .php
        DirectoryIndex index.php
        FcgidFixPathinfo 1
        FcgidMaxRequestLen 20971520
        FcgidMaxProcesses 5000
        FcgidMaxProcessesPerClass 500
    </IfModule>

    # ---------------------------------------------------------------------
    # CUTOVER: legacy entry points become redirects, not scripts.
    # Enable this block together with the DocumentRoot change.
    # ---------------------------------------------------------------------
    # ScriptAlias /cgi-bin/ "/home/christian/WWWRoot/www.hbr1.com/cgi-bin/"
    # ScriptAlias /run/     "/home/christian/WWWRoot/www.hbr1.com/cgi-bin/"
    # <IfModule mod_perl.c>
    #     ScriptAlias /perl/     "/home/christian/WWWRoot/www.hbr1.com/cgi-bin/"
    #     ScriptAlias /cgi-perl/ "/home/christian/WWWRoot/www.hbr1.com/cgi-bin/"
    #     Alias       /cgi-pab/  "/home/christian/WWWRoot/www.hbr1.com/cgi-bin/"
    # </IfModule>
    #
    # Every legacy URL shape is handled by the application itself
    # (App\Http\LegacyUrlMapper), so a single catch-all is enough:
    RedirectMatch 301 ^/(cgi-bin|run|perl|cgi-perl|cgi-pab)/.*$ /

    # Static assets stay served directly from the legacy document root.
    Alias /images  /home/christian/WWWRoot/www.hbr1.com/htdocs/images
    Alias /style   /home/christian/WWWRoot/www.hbr1.com/htdocs/style
    Alias /jscript /home/christian/WWWRoot/www.hbr1.com/htdocs/jscript
    Alias /webtv   /home/christian/WWWRoot/www.hbr1.com/htdocs/webtv
    Alias /playlist /home/christian/WWWRoot/www.hbr1.com/htdocs/playlist
    Alias /chat    /home/christian/WWWRoot/www.hbr1.com/htdocs/chat

    <IfModule mod_suexec.c>
        SuexecUserGroup christian www
    </IfModule>

    # Single entry point.
    <Directory "/home/christian/WWWRoot/www.hbr1.com/public">
        FallbackResource /index.php
    </Directory>
</VirtualHost>
