# HBR1 production vhost (Apache 2.4, Ubuntu 24.04)
#
# This file mirrors what actually runs today, with the two Phase-0 exposure
# fixes applied. It is NOT loaded automatically - it is the reviewed source of
# truth for /etc/apache2/sites-enabled/.
#
# State after the tree cleanup:
#   - DocumentRoot              -> public/, the only web-reachable tree
#   - static assets             -> inside public/, no Alias directives
#   - /cgi-bin/, /run/, /perl/  -> 301 onto the application's canonical routes
#   - .php                      -> mod_fcgid via /usr/bin/php-cgi
#   - SuexecUserGroup christian www
#
# There is no Perl on this host and no `cgi-bin/` in the checkout: the tree is
# archived in `legacy/archive/cgi-bin/` and is not executed by anything.

ServerName www.hbr1.com
ServerAlias hbr1.com

<VirtualHost *:80>
    ServerName www.hbr1.com
    ServerAlias hbr1.com
    Redirect permanent / https://www.hbr1.com/
</VirtualHost>

<VirtualHost *:443>
    ServerAdmin admin@hbr1.com
    ServerName www.hbr1.com
    ServerAlias hbr1.com

    # `public/` is the document root: the front controller *and* every static
    # asset the site uses, so nothing has to be aliased in from outside.
    DocumentRoot /home/christian/WWWRoot/www.hbr1.com/public

    ErrorLog  /home/christian/WWWRoot/www.hbr1.com/var/log/error.log
    CustomLog /home/christian/WWWRoot/www.hbr1.com/var/log/access.log combined

    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/hbr1.com/cert.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/hbr1.com/privkey.pem
    SSLCertificateChainFile /etc/letsencrypt/live/hbr1.com/fullchain.pem

    HostnameLookups Off
    UseCanonicalName Off
    ServerSignature On

    AddType application/x-opera-widgets .wgt

    # ---------------------------------------------------------------------
    # Application root
    # ---------------------------------------------------------------------
    <Directory "/home/christian/WWWRoot/www.hbr1.com/public">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # ---------------------------------------------------------------------
    # Phase 0: things that must never be reachable over HTTP.
    # Without these, config.pab.pl (DB credentials) and settings.inc were
    # served as plain text and /cgi-bin/include/ could be listed.
    # ---------------------------------------------------------------------
    <DirectoryMatch "^/home/christian/WWWRoot/www\.hbr1\.com/(cgi-bin/(include|lib|module)|config|app|views|db|deploy|tools|tests|legacy|var)">
        Require all denied
    </DirectoryMatch>

    # Dotfiles (including the .htpasswd) and editor/backup droppings.
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
    <FilesMatch "(\.(bak|old|orig|swp|save|inc|pl|pm|pab|cgi|xp|tt)$)$">
        Require all denied
    </FilesMatch>

    # ---------------------------------------------------------------------
    # PHP via mod_fcgid (unchanged from the current server)
    # ---------------------------------------------------------------------
    <IfModule mod_fcgid.c>
        AddHandler fcgid-script .php
        FcgidWrapper "/usr/bin/php-cgi -c /etc/" .php
        DirectoryIndex index.php
        FcgidFixPathinfo 1
        FcgidMaxRequestLen 20971520
        FcgidMaxProcesses 5000
        FcgidMaxProcessesPerClass 500
    </IfModule>

    # ---------------------------------------------------------------------
    # CUTOVER: legacy entry points become redirects, not scripts.
    #
    # The ScriptAlias block that used to sit here pointed at
    # `/home/christian/WWWRoot/www.hbr1.com/cgi-bin/`, which no longer exists: the
    # Perl tree is archived in `legacy/archive/cgi-bin/` and the new host has PHP
    # only, so there is no interpreter to map those URLs onto and no reason to
    # keep the directives around as a half-answer.
    #
    # Every legacy URL shape is handled by the application itself
    # (App\Http\LegacyUrlMapper), so a single catch-all is enough. It is kept even
    # though nothing under those prefixes can execute: it is what turns a stale
    # bookmark into the canonical page instead of a 404.
    # ---------------------------------------------------------------------
    RedirectMatch 301 ^/(cgi-bin|run|perl|cgi-perl|cgi-pab)/.*$ /

    # ---------------------------------------------------------------------
    # Static assets
    #
    # Every asset tree the site uses is inside `public/`, which is the document
    # root, so Apache serves it with no help. The former `Alias /images`, `/style`,
    # `/jscript`, `/playlist`, `/chat` and `/webtv` directives, and the
    # `FallbackResource` workarounds they needed, are gone.
    #
    # Why they were a problem: a plain `Alias` maps a URL into a directory and
    # 404s when the file is not there, and FallbackResource only applies to its
    # own <Directory>. That made `/playlist/{station}` and
    # `/webtv/ticker/content.htm` return 404 even though both are application
    # routes. Keeping the file and the route in the same tree means the file wins
    # when it exists and the front controller wins when it does not - no
    # per-directory special case.
    # ---------------------------------------------------------------------

    <IfModule mod_suexec.c>
        SuexecUserGroup christian www
    </IfModule>

    # Single entry point.
    <Directory "/home/christian/WWWRoot/www.hbr1.com/public">
        FallbackResource /index.php
    </Directory>
</VirtualHost>
