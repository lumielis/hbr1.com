<html>
<head>
<meta http-equiv="content-type"
	content="text/html; charset=#[SCALAR $ENV{CHARSET}]#">
<link rel="stylesheet" href="/cgi-htm/style/admin.css">
<title>Stream Stats</title>
</head>
<body>

#[LOOP Stations]#
<p>
<hr noshade size="1">
<font class="Head"><b>#[FIELD $Station->{Title}]#</b></font>
<hr noshade size="1">
#[LOOP Streams]#
#[IF $Stream->{Type}]#
#[IF $Stream->{Status}]#
<p class="Text">
#[SET $Stream->{Status} =~ s/\n/<br \/>/g]#
#[FIELD $Stream->{Status}]#
</p>
#[END IF]#
#[END IF]#
#[END LOOP]#
</p>
#[END LOOP]#

</body>
</html>
