# Apache config for the Perl 5.10 oracle.
#
# Mirrors the production vhost closely enough to be a valid reference, minus
# mod_perl: the /perl/, /cgi-perl/ and /cgi-pab/ aliases are dropped because
# mod_perl embedding is exactly what segfaults in production.

ServerName legacy.hbr1.local
Listen 80

<VirtualHost *:80>
    ServerAdmin admin@hbr1.com
    DocumentRoot /var/www/htdocs

    ErrorLog  /var/log/apache2/legacy-error.log
    CustomLog /var/log/apache2/legacy-access.log combined

    AddDefaultCharset Off
    HostnameLookups Off

    <Directory /var/www/htdocs>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # ScriptAlias exactly as production, so relative `require 'include/...'`
    # resolves the same way.
    ScriptAlias /cgi-bin/ /var/www/cgi-bin/
    ScriptAlias /run/     /var/www/cgi-bin/

    <Directory /var/www/cgi-bin>
        Options -Indexes +ExecCGI -Includes
        AllowOverride None
        Require all granted
        # Perl 5.10 from this image, not the system interpreter.
        SetEnv PERL5LIB /opt/perl-lib
    </Directory>

    # The environment the legacy scripts expect (see settings.inc).
    SetEnv SCRIPT_PATH /var/www/cgi-bin/
</VirtualHost>
