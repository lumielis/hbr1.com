{% extends "layouts/main" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<table cellspacing="0" cellpadding="0" border="0" width="583">
  <tr>
    <td align="left" width="1%" background="/images/body_left.gif">
      <img src="/images/title_left.gif" alt=""></td>
    <td align="center" class="head" background="/images/title_bg.gif" height="1%">
      <font color="#9999ff"><b>PLAYLIST</b></font></td>
    <td align="right" width="1%" background="/images/body_right.gif">
      <img src="/images/title_right.gif" alt=""></td>
  </tr>
  <tr>
    <td align="left" width="1%" background="/images/body_left.gif">&nbsp;</td>
    <td align="center" background="/images/body_bg.jpg" valign="top">
      <div style="margin-top: 15px; margin-bottom: 15px;">
        <table cellspacing="0" cellpadding="4">
          {% for station in stationList %}
          <tr>
            <td align="center">
              <a href="/playlist/{{ station:slug }}"><b>{{ station:title }}</b></a>
            </td>
          </tr>
          {% endfor %}
        </table>
      </div>
    </td>
    <td align="right" width="1%" background="/images/body_right.gif">&nbsp;</td>
  </tr>
</table>
{% endblock %}
