<html>
<head>
<meta http-equiv="content-type"
	content="text/html; charset=#[SCALAR $ENV{'CHARSET'}]#">
<link rel="stylesheet" href="/style/default.css">
<link rel="stylesheet" href="/style/admin.css">
<title>Stream Stats</title>
</head>
<body>

#[LOOP Stations]#
<p>
<hr noshade size="1">
<div style="background-color: #ffffcc">
	<font class="Header2" color="#0000ff"><b>HBR1 - #[PRINT $Station->{'Title'}]#</b></font>
</div>
<hr noshade size="1">
#[LOOP Streams]#
#[IF $Stream->{'Type'}]#
#[IF $Stream->{'Status'}]#
<p class="Text"><pre>
#[PRINT $Stream->{'Status'}]#
</pre></p>
#[END IF]#
#[END IF]#
#[END LOOP]#
</p>
#[END LOOP]#

</body>
</html>
