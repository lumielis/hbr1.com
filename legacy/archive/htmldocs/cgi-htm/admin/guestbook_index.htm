<html>

<head>
<title>Das Gästebuch des FC Aschheim</title>

<style type="text/css">
<!--

.text {
  font-family: Arial, mono;
  font-size: 12px;
}

.head {
  font-family: Arial, mono;
  font-size: 14px;
  color: #4477AA;
}

//-->
</style>

<script language="JavaScript">
<!--
function setVal( form, element, value ) {
  if( ! document.forms ) return;
  if( ! form ) form = document.forms[0];
  if( document.forms[form] ) form = document.forms[form];
  if( ! form.elements[element] ) return;
  form.elements[element].value = value;
}

//-->
</script>

</head>
<body bgcolor="#FFF9E0" marginwidth="15" marginheight="16" topmargin="16" leftmargin="15">

<IF_PAGE_ERROR><p class="text"><font color="#FF0000"><PAGE_MESSAGE></font></p></IF>
<IF_PAGE_MESSAGE><p class="text"><font color="#009900"><PAGE_MESSAGE></font></p></IF>

<table border="1" cellpadding="4" cellspacing="1">
  <tr>
    <td class="text">Pos</td>
    <td class="text">Datum</td>
    <td class="text">Zeit</td>
    <td class="text">Absender</td>
    <td class="text">Inhalt</td>
    <td class="text">Aktiv</td>
    <td class="text" colspan="3">Aktionen</td>
  </tr>
<LOOP_GUESTBOOK order="timestamp" ordir="desc">
  <tr>
    <td class="text"><GUESTBOOK_INDEX></td>
    <td class="text"><GUESTBOOK_DATE></td>
    <td class="text"><GUESTBOOK_TIME></td>
    <td class="text"><a href="mailto:<GUESTBOOK_SUBMITTER> &lt;<GUESTBOOK_EMAIL>&gt;"><GUESTBOOK_SUBMITTER></a></td>
    <td class="text"><ANT_CUT_STR size="50"><GUESTBOOK_CONTENT></td>
    <td class="text" align="center"><IF_GUESTBOOK_STATUS>x<ELSE>-</IF></td>
    <td class="text"><a href="<URL_SYSTEM>/<ENV_FILE>?action=<FORMV_ACTION>&part=kill&guestbook_id=<GUESTBOOK_ID>" onclick="return confirm( 'Wenn Sie den Eintrag löschen, gehen alle Daten verloren.\nWollen Sie fortfahren?' )"><font color="#990000">Löschen</font></a></td>
    <td class="text"><a href="<URL_SYSTEM>/<ENV_FILE>?action=<FORMV_ACTION>&part=status&guestbook_id=<GUESTBOOK_ID>&status=0">Deaktivieren</a></td>
    <td class="text"><a href="<URL_SYSTEM>/<ENV_FILE>?action=<FORMV_ACTION>&part=status&guestbook_id=<GUESTBOOK_ID>&status=1">Aktivieren</a></td>
  </tr>
</LOOP_GUESTBOOK>
</table>

<IF_GUESTBOOK_ITEM_LIMIT>
<p class="text">
<IF_GUESTBOOK_PREV_ITEMS>
<a href="<URL_SYSTEM>/<ENV_FILE>?action=<FORMV_ACTION>&view_from=<GUESTBOOK_PREV_ITEMS>&view_count=<GUESTBOOK_SHOW_ITEMS>">Voherige Einträge</a>
<ELSE>
<font color="#666666">Voherige Einträge</font>
</IF>
|
<IF_GUESTBOOK_NEXT_ITEMS>
<a href="<URL_SYSTEM>/<ENV_FILE>?action=<FORMV_ACTION>&view_from=<GUESTBOOK_NEXT_ITEMS>&view_count=<GUESTBOOK_SHOW_ITEMS>">Weitere Einträge</a>
<ELSE>
<font color="#666666">Weitere Einträge</font>
</IF>
</p>
</IF>

<FORM_ADMIN step="1" method="post">
</form>

<table border="1" cellspacing="1" cellpadding="4">
<FORM_SETTINGS step="1" name="settings" method="post" part="settings">
  <tr>
    <td class="text" id="infoField">Name</td>
    <td class="text" id="infoField">Wert</td>
    <td class="text" id="infoField">Default</td>
    <td class="text" id="infoField">Aktuell</td>
  </tr>
<LOOP_SETTINGS parent="100">
  <tr>
  <input type="hidden" name="id_<COUNTER>" value="<SETTINGS_ID>">
    <td class="text"><IF_ERROR_SETTING><font color="#FF0000"></IF><SETTINGS_NAME></td>
    <td><IF_SETTINGS_CHOICE><INPUT_SETTING class="text"><ELSE><INPUT_SETTING class="text" size="30"></IF></td>
    <td class="text">&nbsp;<a href="javascript:setVal('settings','value_<COUNTER>','<DEFAULT_SETTING>')" id="defaultValue"><DEFAULT_SETTING></a>&nbsp;</td>
    <td class="text">&nbsp;<a href="javascript:setVal('settings','value_<COUNTER>','<CURRENT_SETTING>')" id="currentValue"><CURRENT_SETTING></a>&nbsp;</td>
  </IF>
  </tr>
</LOOP_SETTINGS>
  <tr>
    <td colspan="4" align="center"><img src="<URL_IMAGES>/spacer.gif" width="1" height="5"></td>
  </tr>
  <tr>
    <td colspan="4">
      <table border="0" cellspacing="0" cellpadding="0" width="100%">
        <tr>
          <td><SUBMIT value="Speichern" class="text"></td>
          <td align="right"><input type="reset" value="Reset" class="txt"></td>
        </tr>
      </table>
    </td>
  </tr>
</form>
</table>

</body>

</html>
