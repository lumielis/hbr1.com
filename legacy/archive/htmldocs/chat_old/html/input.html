<script language="JavaScript">
<!--
var MsgBuffer = new Vector();
var MsgPos = 0;
var MsgCur = "";

function SaveMessage( msg ) {
  while( MsgBuffer.length > 30 ) MsgBuffer.pop();
  MsgBuffer.unshift( msg );
  MsgPos = -1;
}

document.forms.JSM_Input.msg.onkeydown = InputOnKeyDown;
//document.forms.JSM_Input.msg.onkeyup = InputOnKeyUp;

function SendMessage( owner ) {
  if( ! owner || ! parent || ! parent.SendMessage ) return false;
  if( owner.msg ) {
    if( owner.msg.value && parent.SendMessage( owner.msg.value ) ) {
      SaveMessage( owner.msg.value );
      owner.msg.value = "";
      MsgCur = "";
    }
    owner.msg.focus();
    return false;
  }
  else if( owner.value && parent.SendMessage( owner.value ) ) {
    SaveMessage( owner.value );
    owner.value = "";
    MsgCur = "";
    owner.focus();
  }
}

SendMessage( document.forms[0] );

function InputOnKeyDown( Event ) {
  var ch = Event ? Event.which : ( window.event && window.event.keyCode ) ? window.event.keyCode : 0;
  switch( ch ) {
    case 13: // enter
      SendMessage( document.forms.JSM_Input.msg );
      break;
    case 38: // arrow up
      if( MsgPos == -1 ) MsgCur = document.forms.JSM_Input.msg.value;
      if( MsgBuffer.length && MsgPos < MsgBuffer.length - 1 ) {
        MsgPos ++;
        document.forms.JSM_Input.msg.value = MsgBuffer.get( MsgPos );
      }
      break;
    case 40: // arrow down
      if( MsgBuffer.length && MsgPos > 0 ) {
        MsgPos --;
        document.forms.JSM_Input.msg.value = MsgBuffer.get( MsgPos );
      }
      else if( MsgPos == 0 ) {
        MsgPos = -1;
        document.forms.JSM_Input.msg.value = MsgCur;
      }
      break;
  }
}

function requestFocus() {
  if( document.forms.JSM_Input && document.forms.JSM_Input.msg ) {
    document.forms.JSM_Input.msg.focus();
  }
}

function JavaDownload( url ) {
  return document.applets[0].startDownload( url ) + "";
}

if( parent ) {
  parent.FocusInput = requestFocus;
  //if( document.applets[0] && document.applets[0].startDownload )
  //  parent.JavaDownload = JavaDownload;
}

//-->
